<!--
  ENGXLABS Primary Logo — Full blue accent on dark background
  Mark: electric blue. Wordmark: "ENGXLABS" full white, no split coloring.
  Use for: hero sections, pitch deck covers, featured placements.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 40" fill="none">
  <title>ENGXLABS</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800&amp;display=swap');
      .wm { font-family: 'Outfit', 'Inter', system-ui, sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.04em; }
    </style>
  </defs>

  <!-- X mark in blue -->
  <rect x="15.5" y="-12" width="9" height="64" fill="#3B82F6" transform="rotate(45 20 20)"/>
  <rect x="15.5" y="-12" width="9" height="64" fill="#3B82F6" transform="rotate(-45 20 20)"/>

  <!-- Wordmark all white -->
  <text class="wm" x="52" y="28" fill="#FFFFFF">ENGXLABS</text>
</svg>
