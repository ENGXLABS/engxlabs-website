<!--
  ENGXLABS Primary Logo — Light variant (for white / light backgrounds)
  Mark: black. Wordmark: "ENG" + "LABS" in near-black, "X" in electric blue.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 40" fill="none">
  <title>ENGXLABS</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800&amp;display=swap');
      .wm { font-family: 'Outfit', 'Inter', system-ui, sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.04em; }
    </style>
  </defs>

  <!-- X mark -->
  <rect x="15.5" y="-12" width="9" height="64" fill="#0A0A0A" transform="rotate(45 20 20)"/>
  <rect x="15.5" y="-12" width="9" height="64" fill="#0A0A0A" transform="rotate(-45 20 20)"/>

  <!-- Wordmark -->
  <text class="wm" x="52" y="28" fill="#0A0A0A">ENG</text>
  <text class="wm" x="103" y="28" fill="#3B82F6">X</text>
  <text class="wm" x="118" y="28" fill="#0A0A0A">LABS</text>
</svg>
