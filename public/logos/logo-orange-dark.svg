<!--
  ENGXLABS Primary Logo — Anthropic warm orange on dark background
  Use for: Anthropic partnership contexts, warm brand moments, print.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 40" fill="none">
  <title>ENGXLABS</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800&amp;display=swap');
      .wm { font-family: 'Outfit', 'Inter', system-ui, sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.04em; }
    </style>
  </defs>

  <!-- X mark in warm orange -->
  <rect x="15.5" y="-12" width="9" height="64" fill="#E55B35" transform="rotate(45 20 20)"/>
  <rect x="15.5" y="-12" width="9" height="64" fill="#E55B35" transform="rotate(-45 20 20)"/>

  <!-- Wordmark: ENG·LABS white, X orange -->
  <text class="wm" x="52" y="28" fill="#FFFFFF">ENG</text>
  <text class="wm" x="103" y="28" fill="#E55B35">X</text>
  <text class="wm" x="118" y="28" fill="#FFFFFF">LABS</text>
</svg>
